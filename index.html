<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>World Cup DFS Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--wc-red:#E63946;--wc-green:#2A9D8F;--wc-pitch:#1B5E20;--wc-gold:#F4C430;--wc-cream:#FAF7F0;--wc-ink:#14213D;--wc-muted:#6B7280;--tier-smash:var(--wc-gold);--tier-strong:var(--wc-red);--tier-lean:var(--wc-green);--bg:var(--wc-cream);--panel:#ffffff;--panel2:#f1f5f9;--line:#d7dde7;--text:var(--wc-ink);--muted:var(--wc-muted);--accent:var(--wc-pitch);--accent2:var(--wc-green);--green:var(--wc-green);--red:var(--wc-red);--gold:var(--wc-gold);--shadow:0 14px 34px rgba(27,94,32,.10)}
body{background:radial-gradient(circle at 12% 0%,rgba(230,57,70,.13),transparent 30%),radial-gradient(circle at 92% 4%,rgba(42,157,143,.14),transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:480px;margin:0 auto;padding-bottom:66px}
body.dark-theme{--bg:#08121f;--panel:#0f2038;--panel2:#0a1628;--line:#1e3a5f;--text:#f8fafc;--muted:#94a3b8;--accent:#7dd3fc;--accent2:#2A9D8F;--green:#2A9D8F;--red:#f87171;--gold:#F4C430;--shadow:none}
button,input,select{font:inherit}
.header{background:linear-gradient(135deg,rgba(230,57,70,.13),rgba(29,53,87,.10) 48%,rgba(42,157,143,.14)),var(--panel);padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;box-shadow:var(--shadow);overflow:hidden}
.header:after{content:"";position:absolute;right:-42px;top:-46px;width:132px;height:132px;background:radial-gradient(circle,rgba(244,196,48,.30),transparent 52%),radial-gradient(circle at 28% 66%,rgba(230,57,70,.20),transparent 34%),radial-gradient(circle at 68% 34%,rgba(42,157,143,.20),transparent 34%);opacity:.75;pointer-events:none}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.header-title{color:var(--accent);font-weight:1000;font-size:16px;letter-spacing:-.2px;position:relative;z-index:1}
.header-actions{display:flex;gap:8px}
.pill-btn{background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer;position:relative;z-index:1}
body.dark-theme .pill-btn{background:var(--panel2)}
.top-nav{display:none;position:relative;z-index:1}
.page{display:none}.page.active{display:block}
.section{padding:14px 16px 0}
.card{background:var(--panel);border:1px solid rgba(29,53,87,.10);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.card-title{color:var(--accent);font-size:13px;font-weight:900;margin-bottom:8px}
.muted{color:var(--muted)}
.tiny{font-size:10px}.small{font-size:11px}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
.loading{display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--accent);font-weight:900}
.error{padding:20px;color:#fecaca;background:#7f1d1d33;border:1px solid #ef444455;border-radius:12px;margin:16px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:10px 4px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);cursor:pointer;border:none;background:none}
.tab-btn.active{color:var(--accent);border-top:2px solid var(--wc-red)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat-box .val{font-size:18px;font-weight:1000;color:var(--accent)}
.stat-box .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 0}
.filter-btn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer}
.filter-btn.active{background:var(--wc-pitch);border-color:var(--wc-pitch);color:#fff}
.pick-card{background:var(--panel);border:1px solid rgba(29,53,87,.12);border-left:4px solid var(--line);border-radius:12px;padding:13px 14px;margin:0 16px 10px;box-shadow:var(--shadow)}
.pick-card.smash{border-left-color:var(--tier-smash);background:linear-gradient(90deg,rgba(244,196,48,.18),transparent 48%),var(--panel)}
.pick-card.strong{border-left-color:var(--tier-strong);background:linear-gradient(90deg,rgba(230,57,70,.08),transparent 48%),var(--panel)}
.pick-card.lean{border-left-color:var(--tier-lean);background:linear-gradient(90deg,rgba(42,157,143,.08),transparent 48%),var(--panel)}
.pick-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.player-name{font-size:15px;font-weight:1000;line-height:1.2;word-break:break-word;overflow-wrap:anywhere}
.team-line{font-size:11px;color:var(--accent2);margin-top:3px;font-weight:800}
.rank-pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--accent);border-radius:6px;padding:2px 6px;font-size:10px;font-weight:900;margin-right:6px}
.tier-pill{font-size:10px;font-weight:1000;padding:4px 8px;border-radius:999px;white-space:nowrap}
.tier-smash{background:var(--tier-smash);color:var(--wc-ink);border:1px solid rgba(20,33,61,.16)}
.tier-strong{background:var(--tier-strong);color:#fff;border:1px solid rgba(230,57,70,.28)}
.tier-lean{background:var(--tier-lean);color:#fff;border:1px solid rgba(42,157,143,.28)}
.injury-badge{display:inline-flex;align-items:center;vertical-align:middle;border-radius:999px;padding:2px 6px;font-size:9px;font-weight:1000;margin-left:5px;white-space:nowrap}
.injury-badge.questionable{background:rgba(244,196,48,.24);color:#8a5d00;border:1px solid rgba(244,196,48,.55)}
.injury-badge.out{background:rgba(230,57,70,.16);color:var(--wc-red);border:1px solid rgba(230,57,70,.42)}
.prop-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.prop-tag{background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--accent);font-size:11px;font-weight:1000;padding:4px 8px}
.lean-over{color:var(--green);font-weight:1000}.lean-under{color:var(--red);font-weight:1000}
.reason{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px}
.form-row{background:linear-gradient(90deg,rgba(42,157,143,.09),rgba(244,196,48,.08)),var(--panel2);border:1px solid rgba(42,157,143,.20);border-radius:9px;padding:8px 9px;margin-top:9px;font-size:10px;color:var(--muted);line-height:1.5}
.form-title{display:block;color:var(--accent);font-weight:1000;text-transform:uppercase;font-size:8px;letter-spacing:.4px;margin-bottom:3px}
.form-metric{display:inline-block;margin-right:8px;color:var(--text);font-weight:800}
.form-row.limited{background:var(--panel2);border-color:var(--line)}
.form-limited{color:var(--muted);font-weight:800}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.meta-cell{background:var(--panel2);border-radius:8px;padding:7px 8px;font-size:10px}
.meta-label{display:block;color:var(--muted);text-transform:uppercase;font-size:8px;font-weight:900;margin-bottom:2px}
.game-btn{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-weight:900;cursor:pointer}
.game-btn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;color:var(--accent)}
.entry-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(148,163,184,.16)}
.entry-row:last-child{border-bottom:none}
.entry-player{font-weight:1000;word-break:break-word;overflow-wrap:anywhere}
.draft-grid{display:grid;gap:12px}
.draft-rec{background:var(--panel);border:1px solid rgba(29,53,87,.12);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.draft-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.draft-total{font-size:22px;font-weight:1000;color:var(--wc-gold);line-height:1}
.draft-player{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:9px 0;border-top:1px solid rgba(148,163,184,.16)}
.slot-badge{min-width:52px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 6px;color:var(--accent);font-size:10px;font-weight:1000}
.draft-name{font-size:12px;font-weight:1000;line-height:1.2;word-break:break-word;overflow-wrap:anywhere}
.draft-meta{font-size:10px;color:var(--muted);margin-top:2px;font-weight:800}
.draft-etfp{text-align:right;font-weight:1000;color:var(--accent2);font-size:12px}
.draft-note{font-size:9px;color:var(--muted);line-height:1.35;margin-top:3px}
.daily-layout{display:grid;gap:12px}
.daily-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.daily-badge{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;color:var(--accent)}
.daily-board{display:grid;gap:12px}
.daily-pane{background:var(--panel);border:1px solid rgba(29,53,87,.12);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.daily-pane-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.daily-pane-title{font-size:14px;font-weight:1000;color:var(--accent)}
.daily-filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.best-available-list{display:grid;gap:0;border:1px solid rgba(148,163,184,.14);border-radius:10px;overflow:hidden;background:var(--panel2)}
.best-available-list .daily-player:first-child{border-top:none}
.daily-columns{display:grid;gap:10px}
.daily-col{background:var(--panel);border:1px solid rgba(29,53,87,.12);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.daily-col-title{display:flex;align-items:center;justify-content:space-between;color:var(--accent);font-size:12px;font-weight:1000;margin-bottom:8px}
.daily-tier-band{border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden;background:var(--panel2)}
.daily-tier-band.tier-1{border-color:rgba(244,196,48,.55);box-shadow:inset 3px 0 0 var(--wc-gold)}
.daily-tier-head{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;font-size:10px;font-weight:1000;color:var(--accent);background:rgba(42,157,143,.07)}
.daily-tier-empty .daily-tier-head{color:var(--muted);background:var(--panel2)}
.daily-player{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;border-top:1px solid rgba(148,163,184,.16);padding:8px}
.daily-player:first-of-type{border-top:none}
.daily-player.out{opacity:.42}
.daily-player.out .daily-name{text-decoration:line-through}
.daily-name{font-size:12px;font-weight:1000;line-height:1.2;word-break:break-word;overflow-wrap:anywhere}
.daily-metrics{font-size:9px;color:var(--muted);margin-top:3px;font-weight:800}
.pos-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;border-radius:7px;font-size:10px;font-weight:1000}
.pos-g{background:var(--wc-gold);color:var(--wc-ink)}
.pos-d{background:var(--wc-pitch);color:#fff}
.pos-md{background:var(--wc-green);color:#fff}
.pos-fw{background:var(--wc-red);color:#fff}
.daily-adj{font-size:14px;font-weight:1000;color:var(--accent);text-align:right;min-width:42px}
.tier-letter{display:inline-block;min-width:22px;text-align:center;border-radius:7px;padding:3px 5px;font-size:10px;font-weight:1000;margin-right:6px}
.tier-s{background:var(--wc-gold);color:var(--wc-ink)}
.tier-a{background:var(--wc-red);color:#fff}
.tier-b{background:var(--wc-green);color:#fff}
.tier-c{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.daily-actions{display:flex;gap:5px;justify-content:flex-end}
.icon-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:5px 7px;font-size:10px;font-weight:1000;cursor:pointer}
.icon-btn.primary{background:var(--wc-pitch);border-color:var(--wc-pitch);color:#fff}
.icon-btn:disabled,.pill-btn:disabled{opacity:.45;cursor:not-allowed}
.roster-grid{display:grid;gap:7px}
.roster-panel{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;margin:12px 0 0}
.roster-slot{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}
.roster-slot.empty{color:var(--muted)}
.roster-slot.empty{border-style:dashed}
.roster-pick-list{display:grid;gap:6px;margin-top:7px;max-height:220px;overflow:auto}
.roster-pick-option{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:7px;text-align:left;color:var(--text);cursor:pointer}
.roster-total{font-size:28px;font-weight:1000;color:var(--wc-gold);line-height:1}
.constraint-line{font-size:10px;color:var(--muted);font-weight:900;line-height:1.6;margin-top:8px}
.slip-grid{display:grid;gap:12px}
.slip-col{background:var(--panel);border:1px solid rgba(29,53,87,.12);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.slip-col-title{display:flex;align-items:center;justify-content:space-between;color:var(--accent);font-size:13px;font-weight:1000;margin-bottom:10px}
.slip-card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:10px}
.slip-card:last-child{margin-bottom:0}
.slip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.payout-badge{display:inline-flex;align-items:center;background:var(--wc-gold);color:var(--wc-ink);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:1000}
.conviction-score{font-size:20px;font-weight:1000;color:var(--accent);line-height:1;text-align:right}
.slip-leg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid rgba(148,163,184,.18);border-radius:9px;padding:8px;margin-top:7px}
.slip-player{font-size:12px;font-weight:1000;line-height:1.25;word-break:break-word;overflow-wrap:anywhere}
.slip-meta{font-size:10px;color:var(--muted);font-weight:800;margin-top:2px;line-height:1.4}
.weak-link{color:var(--wc-red);font-size:9px;font-weight:1000;margin-top:3px}
.copy-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.copy-status{font-size:10px;color:var(--accent2);font-weight:900}
.player-link{display:inline;color:inherit;background:none;border:0;padding:0;font:inherit;font-weight:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.lookup-controls{display:grid;grid-template-columns:1fr;gap:8px}
.lookup-input,.lookup-select{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 10px;font-size:12px;font-weight:800}
.lookup-toggles{display:flex;flex-wrap:wrap;gap:8px}
.lookup-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;color:var(--muted)}
.lookup-table{min-width:720px}
.lookup-row{cursor:pointer}
.lookup-row:hover{background:rgba(42,157,143,.07)}
.status-dot{font-size:10px;font-weight:1000;border-radius:999px;padding:3px 7px;white-space:nowrap}
.status-healthy{background:rgba(42,157,143,.12);color:var(--wc-green);border:1px solid rgba(42,157,143,.24)}
.lookup-detail-grid{display:grid;gap:12px}
.lookup-hero{display:grid;gap:10px;background:linear-gradient(135deg,rgba(244,196,48,.16),rgba(42,157,143,.10)),var(--panel);border:1px solid rgba(29,53,87,.12);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.lookup-name{font-size:22px;font-weight:1000;line-height:1.1;word-break:break-word;overflow-wrap:anywhere}
.lookup-subline{font-size:12px;color:var(--muted);font-weight:900;margin-top:4px}
.lookup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lookup-card{background:var(--panel);border:1px solid rgba(29,53,87,.12);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.bar-chart{display:grid;grid-template-columns:repeat(5,minmax(28px,1fr));gap:8px;align-items:end;min-height:150px;padding-top:18px}
.bar-wrap{display:grid;grid-template-rows:auto 1fr auto;gap:5px;align-items:end;text-align:center}
.bar-val{font-size:10px;font-weight:1000;color:var(--accent)}
.bar{height:calc(var(--h,0) * 1%);min-height:2px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--wc-green),var(--wc-pitch));box-shadow:0 6px 14px rgba(27,94,32,.18)}
.bar-label{font-size:9px;color:var(--muted);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lookup-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lookup-kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.lookup-kpi .val{font-size:18px;font-weight:1000;color:var(--accent)}
.lookup-kpi .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900;margin-top:2px}
.split-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.split-chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;font-weight:900;line-height:1.6}
.lookup-prop-row,.history-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid rgba(148,163,184,.16)}
.lookup-prop-row:first-child,.history-row:first-child{border-top:none}
.injury-banner{background:rgba(244,196,48,.18);border:1px solid rgba(244,196,48,.45);border-radius:12px;padding:11px 12px;font-size:12px;font-weight:900;color:#8a5d00}
.injury-banner.out{background:rgba(230,57,70,.12);border-color:rgba(230,57,70,.38);color:var(--wc-red)}
.teammate-strip{display:flex;gap:7px;overflow-x:auto;padding-top:4px}
.teammate-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;cursor:pointer}
.timestamp{text-align:center;color:var(--muted);font-size:10px;padding:18px 12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:440px}
th{color:var(--accent);text-align:left;border-bottom:1px solid var(--line);padding:8px 6px;background:var(--panel)}
td{border-bottom:1px solid rgba(148,163,184,.14);padding:8px 6px}
.hl{color:var(--accent);font-weight:1000}
.stats-title{color:var(--accent);font-size:18px;font-weight:1000;letter-spacing:-.2px}
.stats-sub{color:var(--muted);font-size:11px;font-weight:800;margin-top:3px}
@media(min-width:768px){
  body{max-width:1400px;padding-bottom:0}
  .header{padding:14px 32px;display:flex;align-items:center;gap:22px}
  .header-top{margin-right:auto}
  .top-nav{display:flex;gap:8px}
  .top-nav .tab-btn{flex:0 0 auto;border-radius:9px;border:none;padding:8px 16px;font-size:13px;border-top:none}
  .top-nav .tab-btn.active{background:rgba(244,196,48,.28);border-top:none;color:var(--wc-ink)}
  body.dark-theme .top-nav .tab-btn.active{color:var(--text);background:rgba(244,196,48,.16)}
  .tab-bar{display:none}
  .section{padding:18px 32px 0}
  .pick-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 32px}
  .pick-card{margin:0}
  .stats-row{grid-template-columns:repeat(4,160px)}
  .draft-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .slip-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .daily-layout{grid-template-columns:1fr;align-items:start}
  .daily-board{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-items:start}
  .daily-columns{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lookup-controls{grid-template-columns:2fr 1fr 1fr 1fr;align-items:center}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function cleanRows(rows){return (rows||[]).map(r=>{const out={};Object.entries(r||{}).forEach(([k,v])=>{const key=String(k||"").replace(/^\uFEFF/,"").trim();out[key]=typeof v==="string"?v.replace(/[\u200B-\u200D\uFEFF]/g,"").trim():v});return out})}
function normalizeProp(v){const s=String(v||"").trim().toUpperCase().replace(/\s+/g,"");if(s==="SHOTSONTARGET"||s==="SOG")return "SOT";if(s==="SHOTS")return "Shots";if(s==="TACKLES")return "Tackles";if(s==="GOALSCORER"||s==="GOALSCORERANYTIME"||s==="ANYTIMEGOALSCORER")return "Goal Scorer";if(s==="GOALS")return "Goals";return String(v||"").trim()}
function normalizeTier(v){const s=String(v||"").trim().toUpperCase();return ["SMASH","STRONG","LEAN"].includes(s)?s:"LEAN"}
function normalizePick(v){const s=String(v||"").trim().toUpperCase();return s==="UNDER"||s==="U"?"Under":"Over"}
function toNum(v){const n=Number(String(v??"").replace(/[^0-9+\-.]/g,""));return Number.isFinite(n)?n:0}

  return `${updated}|${games}|${st.dailySlate.length}`;
}
function persistDailyDraftState(){
  try{
    const signature=dailySlateSignature();
    sessionStorage.setItem("daily_slate_signature",signature);
    sessionStorage.setItem("daily_drafted_ids",JSON.stringify([...st.dailyDrafted]));
    sessionStorage.setItem("daily_my_roster",JSON.stringify(st.dailyRoster));
  }catch(e){}
}
function restoreDailyDraftState(){
  const signature=dailySlateSignature();
  st.dailyStorageSignature=signature;
  const validKeys=new Set(st.dailySlate.map(dailyKey));
  try{
    const storedSig=sessionStorage.getItem("daily_slate_signature");
    if(storedSig!==signature){
      sessionStorage.setItem("daily_slate_signature",signature);
      sessionStorage.setItem("daily_drafted_ids","[]");
      sessionStorage.setItem("daily_my_roster","[]");
      st.dailyDrafted=new Set();
      st.dailyRoster=[];
      return;
    }
    const drafted=JSON.parse(sessionStorage.getItem("daily_drafted_ids")||"[]");
    const roster=JSON.parse(sessionStorage.getItem("daily_my_roster")||"[]");
    st.dailyDrafted=new Set((Array.isArray(drafted)?drafted:[]).filter(k=>validKeys.has(k)));
    st.dailyRoster=(Array.isArray(roster)?roster:[]).filter(k=>validKeys.has(k));
  }catch(e){
    st.dailyDrafted=new Set([...st.dailyDrafted].filter(k=>validKeys.has(k)));
    st.dailyRoster=st.dailyRoster.filter(k=>validKeys.has(k));
  }
}

function dailyRosterCounts(players=dailyRosterPlayers()){return players.reduce((acc,p)=>{acc[p.Position]=(acc[p.Position]||0)+1;return acc},{G:0,D:0,MD:0,FW:0})}
function canAddDailyPlayer(p){
  const key=dailyKey(p);
  if(st.dailyDrafted.has(key)||st.dailyRoster.includes(key)||st.dailyRoster.length>=6)return false;
  const counts=dailyRosterCounts();
  if(p.Position==="G")return counts.G<1;
  const outfield=counts.D+counts.MD+counts.FW;
  if(outfield>=5)return false;
  if(p.Position==="FW")return counts.FW<3;
  if(p.Position==="D")return counts.D<2;
  if(p.Position==="MD")return counts.MD<2;
  return false;
}

async function fetchSheet(name){
  const url = `${GVIZ_BASE}?sheet=${encodeURIComponent(name)}&tqx=out:csv&cache=${Date.now()}`;

  if(!resp.ok) throw new Error(`${name} fetch failed: ${resp.status}`);
  const text = await resp.text();
  const parsed = Papa.parse(text,{header:true,skipEmptyLines:true});
  return cleanRows(parsed.data);
}
async function fetchJson(url){
  const resp = await fetch(`${url}?cache=${Date.now()}`);
  if(!resp.ok) throw new Error(`${url} fetch failed: ${resp.status}`);
  return resp.json();
}

function pickClass(tier){return normalizeTier(tier).toLowerCase()}
function tierPill(tier){const t=normalizeTier(tier);return `<span class="tier-pill tier-${t.toLowerCase()}">${t}</span>`}
function fmtRate(v){const n=Number(v);return Number.isFinite(n)?`${Math.round(n*100)}%`:"—"}
function fmtOne(v){const n=Number(v);return Number.isFinite(n)?n.toFixed(1):"—"}
function injuryStatusValue(row){const raw=row?.Injury_Status;if(raw===undefined||raw===null||String(raw).trim()==="")return 1;const n=Number(raw);return Number.isFinite(n)?n:1}
function injuryBadge(row){
  const status=injuryStatusValue(row);
  if(status>=1)return "";
  const out=status<=0;
  const label=out?"Out":"Questionable";
  const cls=out?"out":"questionable";
  const reason=row.Injury_Reason||label;
  return `<span class="injury-badge ${cls}" title="${esc(reason)}">${out?"🔴":"🟡"} ${label}</span>`;
}
function playerKeyFrom(id,name,team){return String(id||"").trim()||`${normalizeLookupText(name)}|${normalizeLookupText(team)}`}
function teamKey(team){return normalizeLookupText(team)}
function teamAbbr(team){
  const raw=String(team||"").trim();
  if(TEAM_ABBR[raw])return TEAM_ABBR[raw];
  const norm=teamKey(raw);
  for(const [name,abbr] of Object.entries(TEAM_ABBR)){
    if(teamKey(name)===norm)return abbr;
  }
  return norm.slice(0,3).toUpperCase();
}
function matchSpreadForTeams(teamA,teamB){
  const a=teamKey(teamA), b=teamKey(teamB);
  if(!a||!b)return null;
  return st.matchSpreads.find(row=>{
    const home=teamKey(row.Home_Team), away=teamKey(row.Away_Team);
    return (home===a&&away===b)||(home===b&&away===a);
  })||null;
}
function spreadText(row){
  if(!row)return "";
  const homeSpread=toNum(row.Home_Spread);
  const awaySpread=toNum(row.Away_Spread);
  const favorite=homeSpread<0?row.Home_Team:awaySpread<0?row.Away_Team:"Pick'em";
  const favSpread=homeSpread<0?homeSpread:awaySpread<0?awaySpread:0;
  return favorite==="Pick'em"?`PK / O ${fmtOne(row.Total_Goals)}`:`${teamAbbr(favorite)} ${fmtOne(favSpread)} / O ${fmtOne(row.Total_Goals)}`;
}
function playerMatchContext(player){
  const team=player.Team;
  const daily=st.dailySlate.find(p=>String(p.API_Football_ID||"")&&String(p.API_Football_ID)===String(player.API_Football_ID))||
    st.dailySlate.find(p=>teamKey(p.Team)===teamKey(team)&&normalizeLookupText(p.Player_Name)===normalizeLookupText(player.Player_Name));
  const pick=st.picks.find(p=>teamKey(p.Team)===teamKey(team)&&normalizeLookupText(p.Player)===normalizeLookupText(player.Player_Name));
  const opponent=daily?.Opponent||pick?.Opponent||"";
  const spread=matchSpreadForTeams(team,opponent);
  if(!spread)return null;
  const isHome=teamKey(team)===teamKey(spread.Home_Team);
  return {
    opponent,
    fixture: `${spread.Home_Team} vs ${spread.Away_Team}`,
    spread: isHome?spread.Home_Spread:spread.Away_Spread,
    teamXg: isHome?spread.Home_Goal_Expectation:spread.Away_Goal_Expectation,
    oppXg: isHome?spread.Away_Goal_Expectation:spread.Home_Goal_Expectation,
    total: spread.Total_Goals,
    label: spreadText(spread),
    book: spread.Book,
  };
}
function positionCode(raw){
  const n=normalizeLookupText(raw);
  if(n==="goalkeeper"||n==="g")return "G";
  if(n==="defender"||n==="d")return "D";
  if(n==="midfielder"||n==="midfield"||n==="m"||n==="md")return "MD";
  if(n==="attacker"||n==="forward"||n==="fw")return "FW";
  return String(raw||"");
}
function parseList(v){return String(v||"").split(",").map(x=>toNum(x)).filter(x=>Number.isFinite(x))}

function injuryMap(){

function udPoolLookup(){
  const map=new Map();
  st.udPlayerPool.forEach(row=>{
    const last=lookupLastName(normalizeLookupText(row.name));
    const key=`${String(row.team_abbr||"").toUpperCase()}|${last}`;
    if(!last||!row.team_abbr)return;
    if(!map.has(key))map.set(key,[]);
    map.get(key).push({
      name: row.name,
      name_norm: normalizeLookupText(row.name),
      player_id: row.player_id,
      position: positionCode(row.position),
      team_abbr: String(row.team_abbr||"").toUpperCase()
    });
  });
  return map;
}
function findUdPoolMatch(player, lookup=udPoolLookup()){
  const last=lookupLastName(normalizeLookupText(player.Player_Name));
  const candidates=[...(lookup.get(`${teamAbbr(player.Team)}|${last}`)||[])];
  if(!candidates.length)return null;
  const exact=candidates.filter(c=>c.name_norm===normalizeLookupText(player.Player_Name));
  let pool=exact.length?exact:candidates;
  const pos=positionCode(player.Position);
  const positioned=pos?pool.filter(c=>c.position===pos):[];
  if(positioned.length)pool=positioned;
  return pool[0]||null;
}

function playerIndex(){
  const efps=efpMap(), injuries=injuryMap(), survival=survivalMap(), squadNames=squadNameMap(), udLookup=udPoolLookup(), map=new Map();
  function ensure(id,name,team){
    const key=playerKeyFrom(id,name,team);
    if(!map.has(key))map.set(key,{Lookup_ID:key,API_Football_ID:id||"",Player_Name:name||"",Full_Name:"",Squad_Name:"",Search_Aliases:[],Team:team||"",Position:"",Intl_Sample:"",Avg_Minutes:"",Avg_Shots:"",Avg_SOT:"",Avg_Tackles:"",Goals_Per_Match:"",Goal_Scorer_Rate:"",Last_5_Shots:"",Last_5_Goals:"",EFP_Per_Match:"",Expected_Matches:"",ETFP:"",UD_Available:"",UD_Player_ID:"",UD_Name:"",Notes:"",Injury_Status:"",Injury_Reason:"",Injury_Updated:""});
    return map.get(key);
  }
  Object.values(st.squadCache||{}).forEach(team=>{
    (team.players||[]).forEach(player=>{
      const id=String(player.api_id||player.API_Football_ID||"").trim();
      const base=ensure(id,player.name||"",team.team_name||"");
      base.Team=team.team_name||base.Team;
      base.Squad_Name=player.name||base.Squad_Name;
      base.Position=player.position==="Attacker"?"FW":player.position==="Midfielder"?"MD":player.position==="Defender"?"D":player.position==="Goalkeeper"?"G":base.Position;
    });
  });
  st.playerForm.forEach(row=>{
    const base=ensure(row.API_Football_ID,row.Player_Name,row.Nationality);
    Object.assign(base,row,{Player_Name:base.Player_Name||row.Player_Name,Team:base.Team||row.Nationality||""});
  });
  st.playerEfp.forEach(row=>{
    const base=ensure(row.API_Football_ID,row.Player_Name,row.Team);
    base.Team=row.Team||base.Team;
    base.Position=row.Position||base.Position;
    base.EFP_Per_Match=row.EFP_Per_Match||base.EFP_Per_Match;
    base.Intl_Sample=row.Intl_Sample||base.Intl_Sample;
    base.Notes=row.Notes||base.Notes;
  });
  for(const [key,p] of map.entries()){
    const efp=efps.get(key)||efps.get(playerKeyFrom(p.API_Football_ID,p.Player_Name,p.Team));
    if(efp){
      p.Team=efp.Team||p.Team;p.Position=efp.Position||p.Position;p.EFP_Per_Match=efp.EFP_Per_Match||p.EFP_Per_Match;p.Intl_Sample=efp.Intl_Sample||p.Intl_Sample;p.UD_Available=efp.UD_Available||p.UD_Available;p.UD_Player_ID=efp.UD_Player_ID||p.UD_Player_ID;p.UD_Name=efp.UD_Name||p.UD_Name;p.Notes=efp.Notes||p.Notes;
    }
    const surv=survival.get(teamKey(p.Team));
    p.Expected_Matches=surv?.Expected_Matches_Remaining||"";
    p.ETFP=toNum(p.EFP_Per_Match)*toNum(p.Expected_Matches);
    const inj=injuries.get(key)||injuries.get(playerKeyFrom(p.API_Football_ID,p.Player_Name,p.Team));
    if(inj){p.Injury_Status=inj.Status_Score;p.Injury_Reason=inj.Reason||inj.Injury_Type;p.Injury_Updated=inj.Last_Updated;p.Injury_Type=inj.Injury_Type}
    const squad=squadNames.get(String(p.API_Football_ID||"").trim());
    if(squad){
      p.Squad_Name=squad.name||"";
      if(!p.Position&&squad.position){
        p.Position=squad.position==="Attacker"?"FW":squad.position==="Midfielder"?"MD":squad.position==="Defender"?"D":squad.position==="Goalkeeper"?"G":p.Position;
      }
    }
    p.Search_Aliases=[...(LOOKUP_FULL_NAME_ALIASES[String(p.API_Football_ID||"").trim()]||[])];
    const displayNorm=normalizeLookupText(p.Player_Name);
    const squadNorm=normalizeLookupText(p.Squad_Name);

      p.UD_Name=match?.name||"";
    }
  }
  return [...map.values()].filter(p=>p.Player_Name&&normalizeLookupText(p.Player_Name));
}
function lookupTeams(){return [...new Set(playerIndex().map(p=>p.Team).filter(Boolean))].sort()}
function selectedLookupPlayer(){const players=playerIndex();return players.find(p=>String(p.Lookup_ID)===String(st.selectedLookupId))||players[0]||null}
function lookupLastName(norm){const parts=norm.split(" ").filter(Boolean);return parts[parts.length-1]||""}
function lookupInitial(norm){const parts=norm.split(" ").filter(Boolean);return parts[0]?.[0]||""}
function lookupSearchFields(player){
  return [...new Set([
    player.Player_Name,
    player.Full_Name,
    player.Squad_Name,
    player.Team,
    ...(player.Search_Aliases||[])
  ].filter(Boolean))];
}
function playerMatchesSearch(player,query){
  const q=normalizeLookupText(query);
  if(!q)return true;
  return lookupSearchFields(player).some(field=>normalizeLookupText(field).includes(q));
}
function lookupSearchRank(player,query){
  const q=normalizeLookupText(query);
  if(!q)return 0;
  let best=99;
  lookupSearchFields(player).forEach(field=>{
    const norm=normalizeLookupText(field);
    if(!norm)return;
    if(norm===q)best=Math.min(best,0);
    else if(norm.split(" ").includes(q))best=Math.min(best,1);
    else if(norm.startsWith(q))best=Math.min(best,2);
    else if(norm.includes(q))best=Math.min(best,3);
  });
  return best;
}
function findLookupPlayer(name,team){
  const n=normalizeLookupText(name), t=normalizeLookupText(team);
  const players=playerIndex().filter(p=>normalizeLookupText(p.Player_Name));
  const sameTeam=p=>!t||normalizeLookupText(p.Team)===t;
  const last=lookupLastName(n), initial=lookupInitial(n);
  return players.find(p=>sameTeam(p)&&lookupSearchFields(p).some(field=>normalizeLookupText(field)===n))||
    players.find(p=>sameTeam(p)&&lookupSearchFields(p).some(field=>lookupLastName(normalizeLookupText(field))===last&&lookupInitial(normalizeLookupText(field))===initial))||
    players.find(p=>sameTeam(p)&&last&&lookupSearchFields(p).some(field=>lookupLastName(normalizeLookupText(field))===last))||
    players.find(p=>sameTeam(p)&&lookupSearchFields(p).some(field=>{const pn=normalizeLookupText(field);return pn&&n&&(pn.includes(n)||n.includes(pn))}));
}

function resultState(v){
  const u=String(v||"").trim().toUpperCase();
  if(u==="YES"||u==="TRUE"||u==="HIT")return "hit";
  if(u==="NO"||u==="FALSE"||u==="MISS")return "miss";
  if(u==="PUSH")return "push";
  return "";
}

function statsPickKey(row){
  return [
    row.Game_Time||row.DATE||"",
    normalizeLookupText(row.Player),
    normalizeLookupText(row.Team),
    normalizeLookupText(row.Opponent),
    normalizeProp(row.Prop),
    String(row.Line||"").trim(),
    normalizePick(row.Pick).toUpperCase(),
  ].join("|");
}

function latestTimestampMs(row){
  const ms=Date.parse(row.Timestamp||row.DATE||row.Game_Time||"");
  return Number.isFinite(ms)?ms:0;
}

function getEngineStats(){
  const gradedRows=(st.picksHistory||[]).filter(p=>{
    const state=resultState(p.HIT||p.Result);
    return state==="hit"||state==="miss";
  });
  const unique=new Map();
  for(const row of gradedRows){
    const key=statsPickKey(row);
    const prev=unique.get(key);
    if(!prev||latestTimestampMs(row)>=latestTimestampMs(prev))unique.set(key,row);
  }
  const rows=[...unique.values()];
  if(!rows.length)return null;

  const total=rows.length;
  const hits=rows.filter(r=>resultState(r.HIT||r.Result)==="hit").length;
  const overall=hits/total;

  const tiers=["SMASH","STRONG","LEAN"];
  const byTier=tiers.map(t=>{
    const tRows=rows.filter(r=>normalizeTier(r.Tier||r.confidence)===t);
    const tHits=tRows.filter(r=>resultState(r.HIT||r.Result)==="hit").length;
    return {tier:t,n:tRows.length,hits:tHits,rate:tRows.length?tHits/tRows.length:0};
  });

  const propMap={};
  for(const r of rows){
    const m=normalizeProp(r.Prop||r.prop_type||"");
    if(!m)continue;
    if(!propMap[m])propMap[m]={market:m,n:0,hits:0};
    propMap[m].n++;
    if(resultState(r.HIT||r.Result)==="hit")propMap[m].hits++;
  }
  const byMarket=Object.values(propMap)
    .map(m=>({...m,rate:m.n?m.hits/m.n:0}))
    .sort((a,b)=>b.n-a.n||b.rate-a.rate);

  const leans=["OVER","UNDER"];
  const byLean=leans.map(l=>{
    const lRows=rows.filter(r=>normalizePick(r.Pick||r.lean).toUpperCase()===l);
    const lHits=lRows.filter(r=>resultState(r.HIT||r.Result)==="hit").length;
    return {lean:l,n:lRows.length,hits:lHits,rate:lRows.length?lHits/lRows.length:0};
  });

  const cutoff=new Date();
  cutoff.setDate(cutoff.getDate()-14);
  const recent=rows.filter(r=>{
    const d=new Date(r.DATE||r.Timestamp||r.Game_Time);
    return !isNaN(d)&&d>=cutoff;
  });
  const recentHits=recent.filter(r=>resultState(r.HIT||r.Result)==="hit").length;
  const recentRate=recent.length?recentHits/recent.length:0;

  return {total,hits,overall,rawTotal:gradedRows.length,deduped:Math.max(0,gradedRows.length-total),byTier,byMarket,byLean,recent:{n:recent.length,hits:recentHits,rate:recentRate}};
}

function dailySlateHeader(){
  const games=new Map();
  st.dailySlate.forEach(p=>{
    const teams=[p.Team,p.Opponent].sort((a,b)=>teamKey(a).localeCompare(teamKey(b)));
    const key=[teams[0],teams[1],p.Kickoff_Time].join("|");
    if(!games.has(key))games.set(key,{team:p.Team,opp:p.Opponent,kick:p.Kickoff_Time});
  });
  const labels=[...games.values()].map(g=>{
    const spread=matchSpreadForTeams(g.team,g.opp);
    const matchup=spread?`${teamWithFlag(spread.Home_Team)} vs ${teamWithFlag(spread.Away_Team)}`:`${teamWithFlag(g.team)} vs ${teamWithFlag(g.opp)}`;
    const context=spread?` · ${spreadText(spread)}`:"";
    return `${matchup}${context}${g.kick?` (${fmtTime(g.kick)})`:""}`;
  });
  return labels.length?labels.join(" · "):"No daily slate loaded";
}

function dailyFreshness(){
  const updated=(st.dailySlate[0]&&st.dailySlate[0].Updated_At)||"";
  if(!updated)return {text:"Last updated: —", stale:false};
  const dt=new Date(updated);
  if(Number.isNaN(dt.getTime()))return {text:`Last updated: ${updated}`, stale:false};
  const stale=(Date.now()-dt.getTime())>4*60*60*1000;
  return {text:`Last updated: ${dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZoneName:"short"})} · ${st.dailySlate[0]?.Source||"mode unknown"}`, stale};
}

function assignDailyRosterSlots(players){
  const remaining=[...players].sort((a,b)=>toNum(b.Adjusted_EFP)-toNum(a.Adjusted_EFP));
  const slots=[];
  function take(pos){
    const idx=remaining.findIndex(p=>p.Position===pos);
    if(idx<0)return null;
    return remaining.splice(idx,1)[0];
  }
  ["G","D","MD","FW","FW"].forEach(slot=>slots.push({slot,player:take(slot)}));
  const flexIdx=remaining.findIndex(p=>["D","MD","FW"].includes(p.Position));
  slots.push({slot:"FLEX",player:flexIdx>=0?remaining.splice(flexIdx,1)[0]:null});
  return slots;
}

function dailyConstraintLine(){
  const counts=dailyRosterCounts();
  const fwTxt=`FW ${Math.min(counts.FW,2)}/2${counts.FW>2?" + FLEX":""}`;

  return `G ${counts.G>=1?"✓":"-"} · D ${counts.D>=1?"✓":"-"} · MD ${counts.MD>=1?"✓":"-"} · ${fwTxt} · FLEX ${flexUsed? "✓":"-"}`;
}

function slipHasForm(row){
  return String(row.Has_Form_Data||"").trim().toUpperCase()==="TRUE";
}

function slipLegConviction(row){
  const tierWeight={SMASH:3,STRONG:2,LEAN:1}[normalizeTier(row.Tier)]||0.5;
  const confidence=Math.max(0,Math.min(10,toNum(row.Confidence)))/10;
  const formBonus=slipHasForm(row)?1.15:0.9;
  return tierWeight*confidence*formBonus;
}

function groupSlipRecommendations(){
  const groups=new Map();
  st.slipRecommendations.forEach(row=>{
    const rank=String(row.Slip_Rank||"").trim();
    if(!rank)return;
    if(!groups.has(rank))groups.set(rank,[]);
    groups.get(rank).push(row);
  });
  return [...groups.entries()].map(([rank,rows])=>{
    rows.sort((a,b)=>toNum(a.Slot_Number)-toNum(b.Slot_Number));
    return {
      rank,
      size:String(rows[0]?.Slip_Size||""),
      payout:rows[0]?.Payout_Multiplier||"",
      avg:toNum(rows[0]?.Avg_Conviction),
      min:toNum(rows[0]?.Min_Conviction),
      teams:rows[0]?.Teams_Represented||"",
      smash:rows[0]?.SMASH_Count||"",
      generatedAt:rows[0]?.Generated_At||"",
      rows
    };
  }).sort((a,b)=>toNum(a.size)-toNum(b.size)||toNum(a.rank)-toNum(b.rank));
}

function groupSameGameSlipRecommendations(){
  const groups=new Map();
  st.sameGameSlipRecommendations.forEach(row=>{
    const fixture=String(row.Fixture||"").trim();
    const rank=String(row.Slip_Rank||"").trim();
    if(!fixture||!rank)return;
    const key=`${fixture}||${rank}`;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(row);
  });
  return [...groups.entries()].map(([key,rows])=>{
    rows.sort((a,b)=>toNum(a.Slot_Number)-toNum(b.Slot_Number));
    const [fixture,rank]=key.split("||");
    const teams=new Set(rows.map(r=>teamKey(r.Team)).filter(Boolean));
    return {
      key,
      fixture,
      rank,
      size:String(rows[0]?.Slip_Size||""),
      payout:"",
      avg:toNum(rows[0]?.Avg_Conviction),
      min:toNum(rows[0]?.Min_Conviction),
      teams:teams.size,
      smash:rows[0]?.SMASH_Count||"",
      generatedAt:rows[0]?.Generated_At||"",
      narrativeBoost:true,
      rows
    };
  }).sort((a,b)=>a.fixture.localeCompare(b.fixture)||toNum(a.size)-toNum(b.size)||toNum(a.rank)-toNum(b.rank));
}

function slipsBySize(size){
  return groupSlipRecommendations().filter(group=>String(group.size)===String(size));
}

function sameGameSlipsByFixture(){
  const map=new Map();
  groupSameGameSlipRecommendations().forEach(group=>{
    if(!map.has(group.fixture))map.set(group.fixture,[]);
    map.get(group.fixture).push(group);
  });
  return [...map.entries()].map(([fixture,groups])=>({fixture,groups}));
}

function slipCopyText(group, mode="cross"){
  const header=mode==="same"?`${group.fixture} · ${group.size}-leg same-game slip`:`${group.size}-leg WC slip (${group.payout})`;
  const meta=mode==="same"?`Avg conviction ${fmtOne(group.avg)} ⚡ · min ${fmtOne(group.min)}`:`Avg conviction ${fmtOne(group.avg)} · ${group.teams} teams`;
  const lines=[header, meta];
  group.rows.forEach((row,idx)=>{
    lines.push(`${idx+1}. ${row.Player} - ${row.Prop} ${row.Pick} ${row.Line} (${row.Team})`);
  });
  lines.push(`Generated: ${group.generatedAt||new Date().toISOString()}`);
  return lines.join("\n");
}

function copySlip(rank){
  const group=groupSlipRecommendations().find(g=>String(g.rank)===String(rank));
  if(!group)return;
  const text=slipCopyText(group,"cross");
  const status=document.getElementById(`copy-status-${rank}`);
  function markCopied(){
    if(status){status.textContent="Copied";setTimeout(()=>{status.textContent=""},1600)}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(markCopied).catch(()=>window.prompt("Copy slip",text));
  }else{
    window.prompt("Copy slip",text);
  }
}

function copySameGameSlip(encodedFixture, rank){
  const fixture=decodeURIComponent(encodedFixture);
  const group=groupSameGameSlipRecommendations().find(g=>g.fixture===fixture&&String(g.rank)===String(rank));
  if(!group)return;
  const text=slipCopyText(group,"same");
  const id=`same-${encodedFixture}-${rank}`;
  const status=document.getElementById(`copy-status-${id}`);

    if(status){status.textContent="Copied";setTimeout(()=>{status.textContent=""},1600)}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(markCopied).catch(()=>window.prompt("Copy slip",text));
  }else{
    window.prompt("Copy slip",text);
  }
}

function filteredLookupPlayers(){
  const q=normalizeLookupText(st.lookupSearch);
  const rows=playerIndex().filter(p=>{
    if(q&&!playerMatchesSearch(p,q))return false;
    if(st.lookupTeam!=="ALL"&&p.Team!==st.lookupTeam)return false;
    if(st.lookupPosition!=="ALL"&&p.Position!==st.lookupPosition)return false;
    if(st.lookupHideLimited&&toNum(p.Intl_Sample)<5)return false;
    if(st.lookupHideInjured&&injuryStatusValue(p)<=0)return false;
    if(st.lookupHideUnavailable&&String(p.UD_Available||"").toUpperCase()==="FALSE")return false;
    return true;
  });
  const sort=st.lookupSort;
  rows.sort((a,b)=>{
    if(q){
      const rank=lookupSearchRank(a,q)-lookupSearchRank(b,q);
      if(rank)return rank;
    }
    if(sort==="Sample")return toNum(b.Intl_Sample)-toNum(a.Intl_Sample)||a.Player_Name.localeCompare(b.Player_Name);
    if(sort==="EFP")return toNum(b.EFP_Per_Match)-toNum(a.EFP_Per_Match)||a.Player_Name.localeCompare(b.Player_Name);
    if(sort==="ETFP")return toNum(b.ETFP)-toNum(a.ETFP)||a.Player_Name.localeCompare(b.Player_Name);
    return a.Player_Name.localeCompare(b.Player_Name);
  });
  return rows;
}

    if(t&&pt!==t)return false;
    return pn===n || (last&&lookupLastName(pn)===last&&lookupInitial(pn)===initial) || (last&&lookupLastName(pn)===last);
  });
}

function playerHistory(player){

      <div class="lookup-actions">
        <select class="lookup-select" onchange="setLookupStat(this.value)">${LOOKUP_STATS.map(s=>`<option value="${s}" ${stat===s?"selected":""}>${s==="Shots"?"🎯 Shots":s==="SOT"?"⚡ SOT":s==="Tackles"?"🛡 Tackles":"⚽ Goals"}</option>`).join("")}</select>
        <input class="lookup-input" value="${esc(st.lookupLine)}" oninput="setLookupLine(this.value)" placeholder="Line"/>
      </div>
    </div>
  </div>
  ${status<1?`<div class="section"><div class="injury-banner ${injClass}">${status<=0?"🔴 Out":"🟡 Questionable"}: ${esc(player.Injury_Reason||player.Injury_Type||"Status flagged")} ${player.Injury_Updated?`· Updated ${esc(fmtDate(player.Injury_Updated))}`:""}</div></div>`:""}
  <div class="section"><div class="lookup-detail-grid">
    <div class="lookup-card">
      <div class="card-title">GAME LOG — ${esc(stat)}</div>
      ${renderGameLog(player,stat)}
    </div>
    <div class="lookup-card">
      <div class="card-title">AVERAGES</div>
      ${renderAverageTiles(player,stat)}
    </div>
  </div></div>
  <div class="section"><div class="lookup-detail-grid">
    <div class="lookup-card">
      <div class="card-title">vs POSITION GROUP Splits</div>
      ${player.Position==="G"?`<div class="empty">Saves data pending v1.1.</div>`:`<div class="split-strip">
        <div class="split-chip">🎯 Avg Shots<br/><strong>${fmtOne(player.Avg_Shots)}</strong></div>
        <div class="split-chip">⚡ Avg SOT<br/><strong>${fmtOne(player.Avg_SOT)}</strong></div>
        <div class="split-chip">🛡 Tackles<br/><strong>${fmtOne(player.Avg_Tackles)}</strong></div>
        <div class="split-chip">⚽ Goal Rate<br/><strong>${fmtRate(player.Goal_Scorer_Rate)}</strong></div>
      </div>`}
    </div>
    <div class="lookup-card">
      <div class="card-title">Home / Away / Neutral</div>
      <div class="empty">Home/Away split data pending v1.1.</div>
    </div>
  </div></div>
  <div class="section"><div class="lookup-detail-grid">
    <div class="lookup-card">
      <div class="card-title">⚽ vs Upcoming Opponent</div>
      <div class="empty">Head-to-head data pending v1.1.</div>
    </div>
    <div class="lookup-card">
      <div class="card-title">Match Context</div>
      ${matchContext?`<div class="split-strip">
        <div class="split-chip">📈 Team xG<br/><strong>${esc(fmtOne(matchContext.teamXg))}</strong></div>
        <div class="split-chip">🧱 Opp xG<br/><strong>${esc(fmtOne(matchContext.oppXg))}</strong></div>
        <div class="split-chip">Line<br/><strong>${esc(matchContext.label)}</strong></div>
        <div class="split-chip">Book<br/><strong>${esc(matchContext.book||"—")}</strong></div>
      </div><div class="small muted" style="margin-top:8px">${esc(matchContext.fixture)}</div>`:`<div class="empty">Match spread context pending for this player.</div>`}
    </div>
  </div></div>
  <div class="section"><div class="lookup-detail-grid">
    <div class="lookup-card">
      <div class="card-title">📊 Sportsbook Props</div>
      ${props.length?props.map(p=>`<div class="lookup-prop-row"><div><strong>${esc(p.Prop)} ${esc(p.Pick)} ${esc(p.Line)}</strong><div class="small muted">${esc(p.Book||"—")} · ${esc(teamWithFlag(p.Team))} vs ${esc(teamWithFlag(p.Opponent))}</div></div>${tierPill(p.Tier)}</div>`).join(""):`<div class="empty">No current props/picks for this player in Picks_Current.</div>`}
    </div>
  </div></div>
  <div class="section"><div class="lookup-card">
    <div class="card-title">Pick History</div>
    ${history.length?history.map(p=>`<div class="history-row"><div><strong>${esc(fmtDate(p.Timestamp)||"—")}</strong> · ${esc(p.Prop)} ${esc(p.Pick)} ${esc(p.Line)}<div class="small muted">${esc(p.Tier)} · confidence ${esc(p.Confidence||"—")}</div></div><div class="slot-badge">${esc(p.Result||"—")}</div></div>`).join(""):`<div class="empty">No prior picks for this player.</div>`}
  </div></div>
  <div class="section"><div class="lookup-card">
    <div class="card-title">🏆 Tournament Outlook</div>
    <div class="small muted" style="line-height:1.7">${esc(teamWithFlag(player.Team))} projected for <strong>${esc(fmtOne(player.Expected_Matches))}</strong> expected matches. ${esc(fmtOne(player.Expected_Matches))} × ${esc(fmtOne(player.EFP_Per_Match))} EFP/match = <strong>${esc(fmtOne(player.ETFP))}</strong> expected tournament fantasy points.</div>
  </div></div>
  <div class="section"><div class="lookup-card">
    <div class="card-title">Teammates</div>
    <div class="teammate-strip">${teammates.map(p=>`<button class="teammate-chip" onclick="openLookupById('${encodeURIComponent(p.Lookup_ID)}')">${esc(p.Player_Name)}</button>`).join("")||`<span class="small muted">No teammates loaded.</span>`}</div>
  </div></div>`;
}

function renderLookupView(){
  const player=st.selectedLookupId?selectedLookupPlayer():null;
  return player?renderLookupDetail(player):renderLookupBrowse();
}

function renderEntryView(){
  const games=getGames();
  const selected=games.find(g=>g.id===st.selectedGame)||games[0];
  const gamePicks=selected?st.picks.filter(p=>gameId(p)===selected.id).sort((a,b)=>toNum(a.rank)-toNum(b.rank)):[];
  return `<div class="section">
    <div class="card">
      <div class="card-title">🎟️ Game Entry</div>
      ${games.length?`<div style="display:grid;gap:8px;margin-top:10px">${games.map(g=>`<button class="game-btn ${(selected&&selected.id===g.id)?"active":""}" onclick="setSelectedGame('${esc(g.id)}')">${esc(g.label)}</button>`).join("")}</div>`:`<div class="empty">No fixtures available yet. Once the engine writes picks, fixtures will appear here as neutral-site matchups.</div>`}
    </div>
  </div>
  ${selected?`<div class="section">
    <div class="card">
      <div class="card-title">${esc(selected.label)}</div>
      ${gamePicks.length?gamePicks.map(p=>`<div class="entry-row"><div><div class="entry-player">${playerLinkHtml(p.Player,p.Team)}</div><div class="small muted">${esc(teamWithFlag(p.Team))} vs ${esc(teamWithFlag(p.Opponent))} · ${esc(p.Prop)} ${esc(p.Pick)} ${esc(p.Line)}</div></div>${tierPill(p.Tier)}</div>`).join(""):`<div class="empty">No picks logged for this fixture yet.</div>`}
    </div>
  </div>`:""}`;
}

function renderInfoView(){
  return `<div style="padding:16px">
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:28px;margin-bottom:4px">⚽</div>
      <div class="stats-title">How This Dashboard Works</div>
      <div class="stats-sub">Under the hood of the WC DFS Engine</div>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div class="card-title">📡 Data Sources</div>
      <div class="small muted" style="line-height:1.6">
        <div style="margin-bottom:6px"><strong>The Odds API</strong> — Player props, fixtures, and futures for <code>soccer_fifa_world_cup</code>. 48-hour fixture gate keeps credit burn controlled.</div>
        <div style="margin-bottom:6px"><strong>API-Football Pro</strong> — International stats per player, squad rosters for all 48 teams, live lineups 1hr before kickoff, injury reports.</div>
        <div><strong>Google Sheets</strong> — Central warehouse. Engine writes Picks_Current / Picks_History / Player_Form / Player_EFP / Team_Survival / Draft_Recommendations / Daily_Slate / Slip_Recommendations / Player_Injuries.</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div class="card-title">⚙️ Pipelines</div>
      <div class="small muted" style="line-height:1.6">
        <strong>WCEnginev1</strong> — Pulls odds, sends context to Gemini, writes ranked picks.<br/>
        <strong>WCFormPull</strong> — Pulls intl stats per player via squad-cache join.<br/>
        <strong>WCGrader_v1</strong> — Scores picks against /fixtures/players results.<br/>
        <strong>WCDraftHelper</strong> — Tournament-long World Pup recommendations using EFP + survival, Monte Carlo, greedy+swap.<br/>
        <strong>WCDailyDraftPrep</strong> — Match Day Mania snake-draft helper in Pre-XI and Confirmed modes.<br/>
        <strong>WCEntryBuilder</strong> — 3/4/5-leg slip combos with conviction scoring.<br/>
        <strong>WCInjuriesPull</strong> — Per-team injury feed → 🟢/🟡/🔴 badges on cards.
      </div>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div class="card-title">🧮 Player_EFP — Expected Fantasy Points</div>
      <div class="small muted" style="line-height:1.6">
        Bayesian regression toward position-mean (K=10) corrects small-sample misfires. Without it, a player with 1 match × 2 goals looks like a superstar.
      </div>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div class="card-title">🤖 AI Picks — Gemini</div>
      <div class="small muted" style="line-height:1.6">
        Gemini receives daily slate context with player form, odds, fixtures, and injuries. It returns ranked picks with SMASH / STRONG / LEAN tiers. Props-only anchoring is applied after the response.
      </div>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div class="card-title">📖 Abbreviations</div>
      <div class="small muted" style="line-height:1.7">
        EFP — Expected Fantasy Points · UD_FP — Underdog Fantasy Points<br/>
        GK — Goalkeeper · DEF — Defender · MID — Midfielder · FWD — Forward<br/>
        XG — Expected Goals · CS — Clean Sheet · SOG — Shots on Goal<br/>
        SMASH / STRONG / LEAN — AI confidence tiers<br/>
        EV% — Expected Value (hit rate minus implied odds)<br/>
        L5 — Last 5 international matches · K=10 — Bayesian regression strength
      </div>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div class="card-title">🛠️ Stack</div>
      <div class="small muted" style="line-height:1.6">
        Python engines · Google Sheets storage · Gemini AI · The Odds API · API-Football · GitHub Pages · GitHub Actions cron · Vanilla HTML/JS dashboard.
      </div>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div class="card-title">👤 Built By</div>
      <div class="small muted" style="line-height:1.6">
        S. Krolikowski w/ Claude · 2026 · github.com/stephenkrolikowskiUD/wc-dfs
      </div>
    </div>
  </div>`;
}

function render(){
  applyTheme();
  const app=document.getElementById("app");
  if(st.loading){app.className="loading";app.innerHTML="🌎 Loading World Cup slate...";return}
  app.className="";
  const tabs=[
    ["picks","⚽ Picks"],
    ["draft","🏆 Draft"],
    ["daily","🎯 Daily Draft"],
    ["slips","🎫 Slips"],
    ["lookup","🔍 Lookup"],
    ["stats","📊 Stats"],
    ["entry","📋 Game Entry"],
    ["info","ℹ️ Info"],
  ];
  app.innerHTML=`<div class="header">
    <div class="header-top">
      <div class="header-title">⚽ World Cup DFS Dashboard</div>
      <div class="header-actions"><button class="pill-btn" onclick="toggleTheme()">${st.theme==="light"?"🌙 Dark":"☀️ Light"}</button><button class="pill-btn" onclick="loadAllData()">↻ Refresh</button></div>
    </div>
    <div class="top-nav">${tabs.map(([id,label])=>`<button class="tab-btn ${st.activeTab===id?"active":""}" onclick="switchTab('${id}')">${label}</button>`).join("")}</div>
  </div>
  ${st.error?`<div class="error">Could not load ${esc(PICKS_TAB)} sheet: ${esc(st.error)}<br/><span class="small">If the engine has not written the tab yet, this is expected.</span></div>`:""}
  <div class="page ${st.activeTab==="picks"?"active":""}">${renderPicksView()}</div>
  <div class="page ${st.activeTab==="draft"?"active":""}">${renderDraftView()}</div>
  <div class="page ${st.activeTab==="daily"?"active":""}">${renderDailyDraftView()}</div>
  <div class="page ${st.activeTab==="slips"?"active":""}">${renderSlipsView()}</div>
  <div class="page ${st.activeTab==="lookup"?"active":""}">${renderLookupView()}</div>
  <div class="page ${st.activeTab==="stats"?"active":""}">${renderStatsView()}</div>
  <div class="page ${st.activeTab==="entry"?"active":""}">${renderEntryView()}</div>
  <div class="page ${st.activeTab==="info"?"active":""}">${renderInfoView()}</div>
  <div class="tab-bar">${tabs.map(([id,label])=>`<button class="tab-btn ${st.activeTab===id?"active":""}" onclick="switchTab('${id}')">${label.replace("Game Entry","Entry")}</button>`).join("")}</div>`;
}

applyTheme();
window.addEventListener("hashchange",()=>{applyHashRoute();render()});
loadAllData();
</script>
</body>
</html>
