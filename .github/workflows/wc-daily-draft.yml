name: World Cup Daily Draft Prep

on:
  workflow_dispatch:
    inputs:
      slate:
        description: 'Slate games, e.g. RSA@MEX,CZE@KOR. Leave blank for auto-slate.'
        required: false
        type: string
      mode:
        description: 'Lineup mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - pre-xi
          - confirmed
      window_hours:
        description: 'Auto-slate lookahead window'
        required: true
        default: '24'
        type: string

jobs:
  run-world-cup-daily-draft-prep:
    # Archived: the World Cup tournament is complete. Keep the workflow file for history, but never execute it.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests gspread google-auth
      - name: Prepare daily draft slate
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          SLATE="${{ github.event.inputs.slate }}"
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          WINDOW_HOURS="${{ github.event.inputs.window_hours || '24' }}"
          if [ -n "$SLATE" ]; then
            python WCDailyDraftPrep.py --slate "$SLATE" --mode "$MODE"
          else
            python WCDailyDraftPrep.py --auto-slate --window-hours "$WINDOW_HOURS" --mode "$MODE"
          fi
