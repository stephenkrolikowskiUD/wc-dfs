name: World Cup Daily Draft Prep

on:
  workflow_dispatch:
    inputs:
      slate:
        description: 'Slate games, e.g. RSA@MEX,CZE@KOR'
        required: true
      mode:
        description: 'Lineup mode'
        required: true
        default: 'pre-xi'
        type: choice
        options:
          - pre-xi
          - confirmed

jobs:
  run-world-cup-daily-draft-prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests gspread google-auth
      - name: Prepare daily draft slate
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python WCDailyDraftPrep.py --slate "${{ github.event.inputs.slate }}" --mode "${{ github.event.inputs.mode }}"
