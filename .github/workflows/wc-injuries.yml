name: World Cup Injuries

on:
  # Tournament complete; keep manual dispatch for archival/backfill runs only.
  workflow_dispatch:

jobs:
  run-world-cup-injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests gspread google-auth
      - name: Pull World Cup injuries
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -u WCInjuriesPull.py
