name: World Cup Draft Helper

on:
  workflow_dispatch:
    inputs:
      simulations:
        description: 'Monte Carlo simulations per roster'
        required: true
        default: '1000'
      seeds:
        description: 'Greedy+swap random seeds'
        required: true
        default: '8'

jobs:
  run-world-cup-draft-helper:
    # Archived: the World Cup tournament is complete. Keep the workflow file for history, but never execute it.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread google-auth
      - name: Run draft helper
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python WCDraftHelper.py --simulations "${{ github.event.inputs.simulations }}" --seeds "${{ github.event.inputs.seeds }}"
