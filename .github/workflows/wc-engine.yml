name: World Cup Engine

on:
  schedule:
    # Group stage cadence: 06:00, 10:00, 14:00 America/New_York.
    # GitHub Actions cron is UTC, so these are 10:00, 14:00, 18:00 UTC during EDT.
    # Knockout cadence candidate: restore to one daily 08:00 local run after group stage.
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  run-world-cup-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests gspread google-auth google-genai pytz
      - name: Run World Cup engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python WCEnginev1.py --once
