name: World Cup Engine

on:
  # Tournament complete; keep manual dispatch for archival/backfill runs only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-world-cup-engine:
    # Archived: the World Cup tournament is complete. Keep the workflow file for history, but never execute it.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests gspread google-auth google-genai pytz
      - name: Run World Cup engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python WCEnginev1.py --once
      - name: Build slip recommendations
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python WCEntryBuilder.py
      - name: Commit market 422 cache
        run: |
          if [ ! -f market_422_cache.json ]; then
            echo "No market_422_cache.json generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_422_cache.json
          if git diff --cached --quiet; then
            echo "No market 422 cache changes to commit"
          else
            git commit -m "chore: refresh wc market 422 cache"
            git push
          fi
