name: World Cup Player Form

permissions:
  contents: write

on:
  # Tournament complete; keep manual dispatch for archival/backfill runs only.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pull mode'
        required: true
        default: 'picks-only'
        type: choice
        options:
          - picks-only
          - all
          - build-squads
      destructive:
        description: 'Allow clear-and-rebuild; only valid with mode=all'
        required: true
        default: false
        type: boolean

jobs:
  run-world-cup-form:
    # Archived: the World Cup tournament is complete. Keep the workflow file for history, but never execute it.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests gspread google-auth
      - name: Pull World Cup player form
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'picks-only' }}"
          DESTRUCTIVE="${{ github.event.inputs.destructive || 'false' }}"
          EXTRA_ARGS=""
          if [ "$DESTRUCTIVE" = "true" ]; then
            EXTRA_ARGS="--destructive"
          fi
          python -u WCFormPull.py --$MODE $EXTRA_ARGS
      - name: Commit squad cache
        if: ${{ github.event.inputs.mode == 'build-squads' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add squad_cache.json
          if git diff --cached --quiet; then
            echo "No squad cache changes to commit"
          else
            git commit -m "chore: refresh wc squad cache"
            git push
          fi
